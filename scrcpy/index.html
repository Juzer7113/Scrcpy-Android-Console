<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>安卓控制台</title>
<style>
:root{
  --bg1:#070b1c; --bg2:#0d1330; --bg3:#170f38;
  --glass:rgba(255,255,255,.07);
  --glass-2:rgba(255,255,255,.045);
  --stroke:rgba(255,255,255,.14);
  --stroke-2:rgba(255,255,255,.08);
  --txt:#eef2ff; --dim:#a5b0d6;
  --c1:#4ea8ff; --c2:#a06bff; --c3:#ff5fa2;
  --ok:#34d399; --warn:#fbbf24; --off:#64748b;
  --shadow:0 18px 50px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Microsoft YaHei","PingFang SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--txt);
  background:
    radial-gradient(1100px 700px at 12% -8%, rgba(78,168,255,.30), transparent 60%),
    radial-gradient(900px 700px at 92% 6%, rgba(160,107,255,.28), transparent 62%),
    radial-gradient(800px 600px at 60% 110%, rgba(255,95,162,.18), transparent 60%),
    linear-gradient(160deg,var(--bg1),var(--bg2) 45%,var(--bg3));
  background-attachment:fixed;
  min-height:100%;
  padding:34px 30px 60px;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
}
/* 漂浮光斑 */
body::before,body::after{
  content:"";position:fixed;border-radius:50%;filter:blur(90px);opacity:.35;pointer-events:none;z-index:0;
}
body::before{width:460px;height:460px;left:-120px;top:-90px;background:#4ea8ff;animation:float1 20s ease-in-out infinite}
body::after{width:520px;height:520px;right:-140px;bottom:-160px;background:#a06bff;animation:float2 24s ease-in-out infinite}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(70px,60px)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-80px,-50px)}}

.wrap{position:relative;z-index:1;max-width:1280px;margin:0 auto;flex:1;display:flex;flex-direction:column}

.glass{
  background:var(--glass);
  backdrop-filter:blur(22px) saturate(150%);
  -webkit-backdrop-filter:blur(22px) saturate(150%);
  border:1px solid var(--stroke);
  border-radius:22px;
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.10);
}

/* ---------- 顶栏 ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:24px;
  padding:22px 28px;margin-bottom:22px;
}
.brand{display:flex;align-items:center;gap:16px}
.logo{
  width:52px;height:52px;border-radius:16px;flex:none;
  display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:.5px;color:#fff;
  background:linear-gradient(135deg,var(--c1),var(--c2) 55%,var(--c3));
  box-shadow:0 10px 28px rgba(120,110,255,.45), inset 0 1px 0 rgba(255,255,255,.4);
}
h1{font-size:21px;font-weight:700;letter-spacing:.3px}
.sub{font-size:12.5px;color:var(--dim);margin-top:4px}
.stats{display:flex;gap:12px}
.stat{
  min-width:88px;text-align:center;padding:10px 16px;border-radius:16px;
  background:var(--glass-2);border:1px solid var(--stroke-2);
}
.stat b{display:block;font-size:22px;font-weight:700;
  background:linear-gradient(135deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:11.5px;color:var(--dim)}

/* ---------- 添加栏 ---------- */
.addbar{display:flex;align-items:center;gap:12px;padding:18px 20px;margin-bottom:24px;flex-wrap:wrap}
.field{position:relative;flex:1 1 200px;min-width:160px}
.field label{position:absolute;left:14px;top:-8px;font-size:10.5px;color:var(--dim);
  background:linear-gradient(180deg,#131a3d,#141b40);padding:0 7px;border-radius:6px;letter-spacing:.4px}
input{
  width:100%;height:48px;padding:0 15px;border-radius:14px;
  background:rgba(255,255,255,.05);border:1px solid var(--stroke-2);
  color:var(--txt);font-size:14px;font-family:inherit;outline:none;transition:.22s;
}
input::placeholder{color:#7c88b5}
input:focus{border-color:rgba(78,168,255,.65);background:rgba(78,168,255,.10);
  box-shadow:0 0 0 4px rgba(78,168,255,.14)}
.w-port{flex:0 0 130px}

button{
  height:48px;padding:0 24px;border:none;border-radius:14px;cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:600;color:#fff;transition:.22s;
  background:linear-gradient(135deg,var(--c1),var(--c2));
  box-shadow:0 10px 26px rgba(102,126,255,.35);
}
button:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(102,126,255,.5)}
button:active{transform:translateY(0)}
.ghost{
  background:rgba(255,255,255,.07);border:1px solid var(--stroke);
  box-shadow:none;color:var(--dim);font-weight:500;
}
.ghost:hover{background:rgba(255,255,255,.12);color:var(--txt);box-shadow:none}

/* ---------- 设备网格 ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{
  position:relative;padding:20px 18px 18px;border-radius:20px;cursor:pointer;
  background:var(--glass);border:1px solid var(--stroke);
  backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.10);
  transition:transform .25s cubic-bezier(.2,.9,.3,1.2), box-shadow .25s, border-color .25s;
  overflow:hidden;
}
.card::before{
  content:"";position:absolute;inset:0;opacity:0;transition:.25s;pointer-events:none;
  background:radial-gradient(420px 220px at 50% 0%, rgba(78,168,255,.28), transparent 70%);
}
.card:hover{transform:translateY(-6px);border-color:rgba(160,130,255,.55);
  box-shadow:0 26px 60px rgba(10,10,40,.6), 0 0 0 1px rgba(160,130,255,.25), inset 0 1px 0 rgba(255,255,255,.16)}
.card:hover::before{opacity:1}
.card:active{transform:translateY(-2px)}

.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--off)}
.dot.ok{background:var(--ok);box-shadow:0 0 0 4px rgba(52,211,153,.18),0 0 12px var(--ok)}
.dot.warn{background:var(--warn);box-shadow:0 0 0 4px rgba(251,191,36,.18)}
.dot.loading{background:var(--c1);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}

.chead{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.cname{font-size:15px;font-weight:600;letter-spacing:.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.del{
  width:24px;height:24px;border-radius:8px;flex:none;display:grid;place-items:center;
  color:var(--dim);font-size:15px;line-height:1;cursor:pointer;transition:.2s;
  background:rgba(255,255,255,.05);border:none;box-shadow:none;height:24px;padding:0;width:24px;
}
.del:hover{background:rgba(255,95,162,.22);color:#ff9ec4;transform:none;box-shadow:none}

.cip{font-family:Consolas,"SF Mono",monospace;font-size:13px;color:#cdd7ff;margin-bottom:3px}
.cmeta{font-size:11.5px;color:var(--dim);display:flex;align-items:center;justify-content:space-between}
.tag{padding:2px 9px;border-radius:20px;font-size:10.5px;background:rgba(255,255,255,.07);border:1px solid var(--stroke-2)}
.tag.ok{color:var(--ok);background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.3)}
.tag.warn{color:var(--warn);background:rgba(251,191,36,.14);border-color:rgba(251,191,36,.3)}

.go{margin-top:15px;height:38px;width:100%;border-radius:12px;font-size:13px;
  background:rgba(255,255,255,.06);border:1px solid var(--stroke-2);color:var(--dim);
  box-shadow:none;font-weight:500}
.card:hover .go{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border-color:transparent;
  box-shadow:0 8px 20px rgba(102,126,255,.35)}

/* ---------- 卡片按钮 ---------- */
.acts{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px}
.mini{
  flex:1;height:34px;padding:0;border-radius:11px;font-size:12.5px;font-weight:500;
  background:rgba(255,255,255,.06);border:1px solid var(--stroke-2);color:var(--dim);box-shadow:none;
}
.mini:hover{background:rgba(255,255,255,.13);color:var(--txt);transform:none;box-shadow:none}

/* ---------- 弹窗 ---------- */
.mask{
  position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  background:rgba(6,9,24,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.mask.show{display:flex;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  width:min(700px,92vw);max-height:80vh;display:flex;flex-direction:column;
  padding:22px 22px 18px;border-radius:24px;
  background:rgba(22,28,62,.72);
  backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);
  border:1px solid var(--stroke);box-shadow:0 30px 80px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.12);
}
.mhead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.mhead h2{font-size:17px;font-weight:600;letter-spacing:.3px}
.mhead .msub{font-size:12px;color:var(--dim);margin-top:5px}
.mclose{
  width:30px;height:30px;padding:0;border-radius:10px;font-size:17px;line-height:1;flex:none;
  background:rgba(255,255,255,.06);border:none;color:var(--dim);box-shadow:none;
}
.mclose:hover{background:rgba(255,95,162,.22);color:#ff9ec4;transform:none;box-shadow:none}

.applist{flex:1;overflow-y:auto;margin-top:14px;padding-right:4px}
.applist::-webkit-scrollbar{width:8px}
.applist::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:8px}
.app{
  display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;margin-bottom:8px;
  background:rgba(255,255,255,.045);border:1px solid var(--stroke-2);transition:.2s;
}
.app:hover{background:rgba(255,255,255,.09);border-color:var(--stroke)}
.app .ic{
  width:38px;height:38px;border-radius:11px;flex:none;position:relative;overflow:hidden;
  font-size:16px;font-weight:700;color:#dce6ff;
  background:linear-gradient(135deg,rgba(78,168,255,.32),rgba(160,107,255,.32));
  border:1px solid var(--stroke-2);
}
.app .ic span{position:absolute;inset:0;display:grid;place-items:center}
.app .icimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:10px;background:#0e1330}
.appinfo{flex:1;min-width:0}
.appinfo .n{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appinfo .p{font-size:11.5px;color:var(--dim);font-family:Consolas,monospace;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.appinfo .s{font-size:11.5px;color:#8fa0d8;margin-top:3px}
.uninst{
  height:32px;padding:0 16px;border-radius:10px;font-size:12.5px;flex:none;box-shadow:none;
  background:rgba(255,95,162,.16);border:1px solid rgba(255,95,162,.3);color:#ff9ec4;
}
.uninst:hover{background:rgba(255,95,162,.34);color:#fff;transform:none;box-shadow:none}
.loading{text-align:center;color:var(--dim);padding:44px 0;font-size:13.5px}

/* ---------- 空状态 ---------- */
.empty{
  text-align:center;padding:70px 20px;border-radius:22px;
  border:1px dashed var(--stroke);background:var(--glass-2);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
}
.empty .ico{font-size:38px;opacity:.5;margin-bottom:14px}
.empty p{color:var(--dim);font-size:14px;line-height:1.9}
.empty code{background:rgba(255,255,255,.08);padding:2px 8px;border-radius:6px;
  font-family:Consolas,monospace;color:#cdd7ff}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:38px;transform:translateX(-50%) translateY(20px);
  z-index:99;opacity:0;pointer-events:none;transition:.3s}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast div{
  padding:13px 24px;border-radius:14px;font-size:13.5px;
  background:rgba(20,26,60,.85);border:1px solid var(--stroke);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 16px 40px rgba(0,0,0,.5);
}
.hint{margin-top:auto;padding-top:26px;text-align:center;font-size:12px;color:#7f8bb8;line-height:1.9}
.hint b{color:#a9b6e8;font-weight:600}
</style>
</head>
<body>
<div class="wrap">

  <header class="topbar glass">
    <div class="brand">
      <div class="logo">STB</div>
      <div>
        <h1>安卓控制台</h1>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b id="sTotal">0</b><span>设备总数</span></div>
      <div class="stat"><b id="sOnline">0</b><span>在线</span></div>
      <div class="stat" id="verBox" title="服务版本，重启后应 ≥3"><b id="sVer">?</b><span>服务</span></div>
    </div>
  </header>

  <section class="addbar glass">
    <div class="field">
      <label>设备 IP</label>
      <input id="ip" placeholder="例：192.168.1.253" autocomplete="off">
    </div>
    <div class="field w-port">
      <label>端口</label>
      <input id="port" value="5555" autocomplete="off">
    </div>
    <div class="field">
      <label>备注（可选）</label>
      <input id="name" placeholder="例：前台 / 305 房" autocomplete="off">
    </div>
    <button id="btnAdd">添加设备</button>
    <button id="btnRefresh" class="ghost">刷新状态</button>
  </section>

  <main class="grid" id="grid"></main>

  <div class="empty" id="empty">
    <div class="ico">📺</div>
    <p>还没有设备，在上面填 IP 添加</p>
  </div>

  <div class="hint">
    控制窗口内：<b>鼠标点击</b>=触摸 · <b>方向键/回车</b>=遥控器 · <b>右键 / Alt+B</b>=返回<br>
    Android 11+ 首次先在「无线调试」里配对一次
  </div>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <div class="mhead">
      <div>
        <h2 id="mTitle">应用列表</h2>
        <div class="msub" id="mSub">第三方应用 · 点击右侧卸载</div>
      </div>
      <button class="mclose" id="mClose">×</button>
    </div>
    <input id="appSearch" placeholder="搜索应用名或包名">
    <div class="applist" id="appList"></div>
  </div>
</div>

<input type="file" id="fileInput" accept=".apk" style="display:none">

<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const grid = $('grid'), empty = $('empty');
let devices = [];

function toast(msg){
  const t = $('toast');
  t.innerHTML = '<div>' + msg + '</div>';
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2400);
}

function statusText(s){
  return s === 'device' ? '在线' : s === 'unauthorized' ? '未授权' : s === 'offline' ? '离线' : '未知';
}

function render(){
  if(!Array.isArray(devices)) devices = [];
  grid.innerHTML = '';
  const online = devices.filter(d => d.status === 'device').length;
  $('sTotal').textContent = devices.length;
  $('sOnline').textContent = online;
  empty.style.display = devices.length ? 'none' : 'block';

  devices.forEach(d => {
    const ok = d.status === 'device';
    const warn = d.status === 'unauthorized';
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML =
      '<div class="chead">' +
        '<span class="dot ' + (ok ? 'ok' : warn ? 'warn' : '') + '"></span>' +
        '<span class="cname">' + (d.name || '设备 ' + d.ip) + '</span>' +
        '<button class="del" title="移除">×</button>' +
      '</div>' +
      '<div class="cip">' + d.ip + ':' + d.port + '</div>' +
      '<div class="cmeta">' +
        '<span>' + (ok ? 'ADB 已连接' : warn ? '需在盒子上确认授权' : '未连接') + '</span>' +
        '<span class="tag ' + (ok ? 'ok' : warn ? 'warn' : '') + '">' + statusText(d.status) + '</span>' +
      '</div>' +
      '<div class="acts">' +
        '<button class="go">连接并控制</button>' +
        '<div class="row">' +
          '<button class="mini" data-act="install">安装 APK</button>' +
          '<button class="mini" data-act="apps">卸载</button>' +
        '</div>' +
      '</div>';

    el.querySelector('.go').onclick = e => { e.stopPropagation(); connect(d); };
    el.querySelector('[data-act="install"]').onclick = e => { e.stopPropagation(); installApp(d); };
    el.querySelector('[data-act="apps"]').onclick = e => { e.stopPropagation(); openApps(d); };
    el.querySelector('.del').onclick = e => { e.stopPropagation(); remove(d.id); };
    el.onclick = () => connect(d);
    grid.appendChild(el);
  });
}

async function api(url, opt){
  const r = await fetch(url, opt);
  return r.json();
}

async function load(){
  try{
    const r = await api('/api/devices');
    if(r.ver) $('sVer').textContent = 'v' + r.ver; else $('sVer').textContent = '旧';
    devices = r.devices || [];
    render();
    refresh();
  }catch(e){ toast('后端未启动：请先运行 start.bat'); }
}

async function add(){
  const ip = $('ip').value.trim();
  const port = $('port').value.trim() || '5555';
  const name = $('name').value.trim();
  if(!ip){ toast('请先填 IP'); $('ip').focus(); return; }
  const r = await api('/api/devices', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ip, port, name})
  });
  if(r.ok){
    devices = r.devices || [];
    render();
    $('ip').value = ''; $('name').value = ''; $('ip').focus();
    toast('已添加 ' + ip + ':' + port);
  }
}

async function remove(id){
  const r = await api('/api/devices?id=' + id, {method:'DELETE'});
  devices = r.devices || [];
  render();
}

async function connect(d){
  toast('正在启动 ' + d.ip + ':' + d.port + ' ...');
  try{
    const r = await api('/api/connect', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id: d.id})
    });
    let msg = String(r.msg || '').replace(/\s+/g, ' ').trim();
    if(msg.length > 400) msg = msg.slice(0, 400);
    toast(r.ok ? '已启动控制窗口：' + r.target : '启动失败：' + msg);
  }catch(e){ toast('请求失败：' + e); }
}

async function refresh(){
  [...grid.children].forEach(c => { const d = c.querySelector('.dot'); if(d) d.classList.add('loading'); });
  try{
    const r = await api('/api/status', {method:'POST'});
    devices = r.devices || [];
  }catch(e){}
  render();
}

/* ---------- 安装 / 卸载 ---------- */
const mask = $('mask'), appList = $('appList'), appSearch = $('appSearch'), fileInput = $('fileInput');
let curDev = null, curApps = [];

function fmtSize(b){
  if(!b) return '-';
  const mb = b / 1048576;
  return mb >= 1 ? mb.toFixed(1) + ' MB' : Math.round(b / 1024) + ' KB';
}

async function installApp(d){
  fileInput.value = '';
  fileInput.onchange = async () => {
    const f = fileInput.files[0];
    if(!f) return;
    toast('上传 ' + f.name + ' ...');
    try{
      const u = await fetch('/api/upload?name=' + encodeURIComponent(f.name), {
        method:'POST', body:f, headers:{'Content-Type':'application/octet-stream'}
      }).then(r => r.json());
      if(!u.ok){ toast('上传失败'); return; }
      toast('安装中，请稍候 ...');
      const r = await api('/api/install', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({id:d.id, file:u.file})
      });
      toast(r.ok ? '安装成功' : '安装失败：' + String(r.msg || '').slice(0, 90));
    }catch(e){ toast('出错：' + e); }
  };
  fileInput.click();
}

async function openApps(d){
  curDev = d;
  mask.classList.add('show');
  $('mTitle').textContent = d.name || d.ip;
  $('mSub').textContent = d.ip + ':' + d.port + ' · 第三方应用';
  appSearch.value = '';
  appList.innerHTML = '<div class="loading">正在读取应用列表 ...<br><span style="font-size:12px">首次打开需拉取 APK 解析应用名和图标，请稍候</span></div>';
  try{
    const r = await api('/api/apps', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id:d.id})
    });
    curApps = r.apps || [];
    $('mSub').textContent = d.ip + ':' + d.port + ' · 第三方应用' + (r.src === 'pkg' ? ' · 本机无 aapt，仅显示包名' : '');
    if(!curApps.length) appList.innerHTML = '<div class="loading">没有第三方应用</div>';
    else renderApps();
  }catch(e){ appList.innerHTML = '<div class="loading">读取失败：后端未启动</div>'; }
}

function renderApps(){
  const q = appSearch.value.trim().toLowerCase();
  const list = curApps.filter(a => !q ||
    (a.name || '').toLowerCase().includes(q) || a.pkg.toLowerCase().includes(q));
  if(!list.length){ appList.innerHTML = '<div class="loading">没有匹配的应用</div>'; return; }
  appList.innerHTML = '';
  list.forEach(a => {
    const el = document.createElement('div');
    el.className = 'app';
    el.innerHTML =
      '<div class="ic"><span>' + (a.name || a.pkg).charAt(0).toUpperCase() + '</span>' +
      (a.icon ? '<img class="icimg" src="/api/icon?pkg=' + encodeURIComponent(a.pkg) + '" onerror="this.style.display=\'none\'">' : '') +
      '</div>' +
      '<div class="appinfo">' +
        '<div class="n">' + (a.name || a.pkg.split('.').pop()) + '</div>' +
        '<div class="p">' + a.pkg + '</div>' +
        '<div class="s">' + fmtSize(a.size) + '</div>' +
      '</div>' +
      '<button class="uninst">卸载</button>';
    el.querySelector('.uninst').onclick = () => uninstallApp(a);
    appList.appendChild(el);
  });
}

async function uninstallApp(a){
  if(!confirm('确定卸载？\n' + (a.name || a.pkg) + '\n' + a.pkg)) return;
  toast('正在卸载 ' + (a.name || a.pkg) + ' ...');
  try{
    const r = await api('/api/uninstall', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id:curDev.id, pkg:a.pkg})
    });
    toast(r.ok ? '已卸载' : '卸载失败：' + String(r.msg || '').slice(0, 90));
    if(r.ok){ curApps = curApps.filter(x => x.pkg !== a.pkg); renderApps(); }
  }catch(e){ toast('出错：' + e); }
}

$('mClose').onclick = () => mask.classList.remove('show');
mask.onclick = e => { if(e.target === mask) mask.classList.remove('show'); };
appSearch.oninput = renderApps;
document.addEventListener('keydown', e => { if(e.key === 'Escape') mask.classList.remove('show'); });

$('btnAdd').onclick = add;
$('btnRefresh').onclick = refresh;
['ip','port','name'].forEach(id => {
  $(id).addEventListener('keydown', e => { if(e.key === 'Enter') add(); });
});

load();
setInterval(refresh, 30000);
</script>
</body>
</html>
